<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área de trabalho de CS · CITi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Linguagem do CITi Flow: preto com grade, números grandes numerados, curvas com brilho, faixa em gradiente no topo dos painéis */
:root{
  color-scheme:dark;
  --bg:#08080A;--pn:#101014;--pn-2:#16161C;--line:#1F1F27;--line-2:#2A2A34;--grid:#1A1A21;
  --ink:#F1F0F5;--ink-2:#A8A6B5;--muted:#6C6A7A;
  --green:#39F28A;--cyan:#3DE8FF;--violet:#A78BFA;--amber:#FFC24B;--red:#FF4D6D;--blue:#2F7BFF;
  --t-recompra:#FFC24B;--t-expansao:#3DE8FF;--t-retainer:#FF5C9A;--t-synergy:#A78BFA;
  --rainbow:linear-gradient(90deg,rgba(57,242,138,.85),rgba(57,242,138,.12));
  --sans:"Sora",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:500;letter-spacing:-.02em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.ink2{color:var(--ink-2)}
.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(8,8,10,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:22px}
.logo{height:34px;width:auto;display:block;align-self:flex-start;object-fit:contain}.app.mini .logo{align-self:center}.app.mini .logo{height:22px}
.logo+span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line-2);padding-left:12px}
.nav{display:flex;gap:4px;background:var(--pn);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:auto;overflow-x:auto}
.nav a{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-size:13px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--pn-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav a svg{width:15px;height:15px}
.nav a.on svg{color:var(--green)}
.nav .cnt{font-family:var(--mono);font-size:10.5px;color:var(--red)}
.btn{border:1px solid var(--line-2);background:var(--pn);border-radius:999px;padding:8px 16px;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.go{background:var(--green);border-color:var(--green);color:#03220F;font-weight:500;box-shadow:0 0 22px rgba(57,242,138,.25)}
.btn.sm{padding:5px 12px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--cyan)}

main{max-width:1320px;margin:0 auto;padding:30px 28px 80px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:30px;font-weight:500}
.ph p{color:var(--ink-2);margin-top:6px;max-width:70ch}

/* painéis */
.pn{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 120px),var(--pn);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;overflow:hidden}
.rb:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--rainbow);opacity:.9}
.pn h2{font-size:19px}
.pn .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g21{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:18px}

/* faixa de números (CITi Flow) */
.strip{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));background:var(--pn);border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden}
.strip .cell{padding:20px 22px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.strip .cell:last-child{border-right:0}
.idx{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--c,var(--violet))}
.idx i{flex:1;height:1px;background:linear-gradient(90deg,var(--c,var(--violet)),transparent);opacity:.5}
.strip .lab{font-size:13px;color:var(--ink-2);margin-top:10px}
.strip .big{font-size:38px;font-weight:400;letter-spacing:-.04em;line-height:1.05;white-space:nowrap}
.strip .big small{font-size:16px;color:var(--muted);letter-spacing:0}
.strip .sm{font-size:11.5px;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;border-radius:8px;padding:4px 10px;border:1px solid;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.k-g{color:var(--green);border-color:rgba(57,242,138,.35);background:rgba(57,242,138,.06)}
.k-y{color:var(--amber);border-color:rgba(255,194,75,.35);background:rgba(255,194,75,.06)}
.k-r{color:var(--red);border-color:rgba(255,77,109,.4);background:rgba(255,77,109,.07)}
.k-n{color:var(--muted);border-color:var(--line-2)}
.k-v{color:var(--violet);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.06)}
.k-op{color:#3DE8FF;border-color:rgba(61,232,255,.45);background:rgba(61,232,255,.08);font-size:16px!important}
.k-od{color:#FFC24B;border-color:rgba(255,194,75,.5);background:rgba(255,194,75,.08);font-size:15px!important}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;border-radius:8px;padding:4px 10px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}.tag b{font-size:13px;font-weight:400}
.sq.op{border-color:rgba(61,232,255,.4);background:linear-gradient(90deg,rgba(61,232,255,.06),transparent 60%)}.sq.op .sqa dt{color:#7FEFFF}
.sq.od{border-color:rgba(255,194,75,.4);background:linear-gradient(90deg,rgba(255,194,75,.06),transparent 60%)}
.k-c{color:var(--cyan);border-color:rgba(61,232,255,.35);background:rgba(61,232,255,.06)}
.seg{display:inline-flex;gap:2px;background:var(--pn);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 15px;font-size:13px;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--pn-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.ln{width:16px;height:2px;border-radius:2px;display:inline-block}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.draw{stroke-dasharray:5000;stroke-dashoffset:5000;animation:draw 1.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sweep{transform-origin:var(--ox) var(--oy);animation:sweep 7s linear infinite}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(180deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}

/* Início */
.hero{padding:22px 22px 8px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.hero h1{font-size:34px;font-weight:400}
.hero h1 b{font-weight:500}
.radar-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:11px;color:var(--muted);justify-content:center;padding:4px 0 10px}
.radar-legend b{color:var(--ink-2);font-weight:500}
.dot-hit{cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:16px}
.wd{border:1px solid var(--line);border-radius:14px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.012)}
.wd.today{border-color:rgba(57,242,138,.45);box-shadow:inset 0 0 0 1px rgba(57,242,138,.15)}
.wd .h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.wd .h b{font-family:var(--sans);font-size:20px;color:var(--ink);font-weight:400;letter-spacing:-.02em}
.wd.we{opacity:.45}
.evc{border:0;text-align:left;border-radius:9px;padding:7px 8px;font-size:11.5px;line-height:1.3;background:color-mix(in srgb,var(--c) 12%,transparent);border-left:2px solid var(--c);color:var(--ink)}
.evc span{display:block;color:var(--ink-2);font-size:10.5px;margin-top:2px}
.evc[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 24%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.evd{margin-top:14px;border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:16px;align-items:start}
.evd .cap{display:block;margin-bottom:4px}
.evd div{font-size:13px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.sev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1px solid}
.alert .t{font-size:14px}.alert .x{font-size:12px;color:var(--muted)}

/* Carteira */
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.stg{padding:18px 18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.stg:last-child{border-right:0}
.stg .n{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1}
.stg .nm{font-size:13px;font-weight:500}
.stg .dots{display:flex;gap:5px;flex-wrap:wrap;min-height:10px}
.stg .dots i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pc{background:var(--pn);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.pc:hover{border-color:var(--line-2);transform:translateY(-2px)}
.pc:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
.pc .co{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pc h3{font-size:16px;margin-top:3px}
.axbars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:54px}
.axbars div{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.axbars i{width:100%;border-radius:4px 4px 2px 2px;display:block}
.axbars span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.pc .rs{font-size:12px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start}
.pc .rs i{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none}
.hist{display:flex;gap:3px}
.hist i{flex:1;height:5px;border-radius:2px}
.dm{width:100%;border-collapse:separate;border-spacing:6px}
.dm th{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-bottom:6px}
.dm td{text-align:center}
.dm td.nm{text-align:left;font-size:13.5px;white-space:nowrap;padding-right:12px}
.dm td.nm span{display:block;font-size:11.5px;color:var(--muted)}
.dm .o{width:18px;height:18px;border-radius:50%;display:inline-block}
.dm tr[data-open]{cursor:pointer}

/* Cliente */
.ch{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ch h1{font-size:36px;font-weight:400}
.ch select{background:var(--pn);border:1px solid var(--line-2);border-radius:999px;padding:7px 14px}
.track{display:flex;align-items:flex-start;margin:22px 0 4px}
.track .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;font-size:11.5px;color:var(--muted);text-align:center}
.track .st:before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line-2)}
.track .st:first-child:before{display:none}
.track .done:before,.track .cur:before{background:var(--green);box-shadow:0 0 10px rgba(57,242,138,.6)}
.track .o{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);z-index:1}
.track .done .o{background:var(--green);border-color:var(--green);box-shadow:0 0 10px var(--green)}
.track .cur .o{border-color:var(--green);box-shadow:0 0 0 6px rgba(57,242,138,.15)}
.track .cur{color:var(--ink)}
.read{border:1px solid rgba(61,232,255,.3);background:linear-gradient(90deg,rgba(61,232,255,.08),transparent);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;font-size:14px}
.read .cap{color:var(--cyan);white-space:nowrap;padding-top:3px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:14px}
.gauge{text-align:center}
.gauge .lbl{font-size:12.5px;color:var(--ink-2);margin-top:-4px}
.gauge .lm{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.waitb{display:grid;grid-template-columns:minmax(0,1fr) 170px 54px;gap:12px;align-items:center;padding:9px 0;font-size:13px;border-top:1px solid var(--line)}
.waitb:first-of-type{border-top:0}
.tr{height:8px;border-radius:4px;background:var(--pn-2);overflow:hidden}
.tr i{display:block;height:100%;border-radius:4px}
.fbl{display:grid;grid-template-columns:52px 4px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.fbl:first-of-type{border-top:0}
.fbl .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fbl .b{border-radius:2px}

/* Raio-x */
.ins{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:22px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0}
.ins .nb{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1}
.ins .nb small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.ins h3{font-size:16px;font-weight:500;line-height:1.35}
.ins .dots{display:flex;gap:4px;margin-top:8px}
.ins .dots i{width:9px;height:9px;border-radius:50%}
.ins .ac{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.ins .ac b{color:var(--ink);font-weight:500}

/* tabelas */
table.t{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px;min-width:720px}
table.t th{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;text-align:left;padding:4px 12px}
table.t td{padding:12px;background:var(--pn-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.t td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
table.t td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
table.t .r{text-align:right;font-family:var(--mono)}
.scroll{overflow-x:auto}
.casc{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.casc .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.casc .r1 b{font-size:24px;font-weight:400;letter-spacing:-.03em}
.casc .pc2{font-family:var(--mono);font-size:10.5px;border-radius:6px;padding:1px 6px;margin-left:8px}
.casc .bar{height:8px;border-radius:4px;background:var(--pn-2);margin-top:8px;overflow:hidden}
.casc .bar i{display:block;height:100%;border-radius:4px}
.res{margin-top:6px}
.res .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:repeating-linear-gradient(90deg,rgba(167,139,250,.35) 0 6px,transparent 6px 12px)}
.res .bar i{display:block;height:100%}
.res .lbls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px}
.res .lbls div{font-family:var(--mono);font-size:15px}
.res .lbls .cap{display:block;margin-bottom:4px}
.mock{border:1px solid var(--line-2);border-radius:16px;background:var(--pn-2);padding:14px}
.mcard{border:1px solid var(--line);border-left:2px solid var(--cyan);border-radius:12px;padding:12px;margin-top:10px;background:var(--pn)}
.mcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:12px}.mcard dt{color:var(--muted)}.mcard dd{margin:0}
.tl{display:flex;align-items:flex-start;gap:0;margin-top:24px;overflow-x:auto;padding-bottom:6px}
.tl .ev2{flex:1;min-width:170px;position:relative;padding-top:26px}
.tl .ev2:before{content:"";position:absolute;top:7px;left:0;right:0;height:1px;background:var(--line-2)}
.tl .ev2 i{position:absolute;top:1px;left:0;width:13px;height:13px;border-radius:50%;box-shadow:0 0 12px currentColor}
.tl .ev2 .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tl .ev2 p{font-size:13px;margin-top:4px;padding-right:18px}
.q4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.q4 .pn .p{font-size:46px;font-weight:300;letter-spacing:-.04em;line-height:1;color:var(--c)}
.q4 h3{font-size:17px;margin-top:10px;line-height:1.35}
.q4 .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;font-size:12.5px;color:var(--ink-2)}
.q4 ul{margin:6px 0 0;padding-left:16px}
.jt{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:22px}
.jt .s{position:relative;padding-top:34px}
.jt .s:before{content:"";position:absolute;top:13px;left:0;right:-12px;height:2px;background:var(--rainbow);opacity:.5}
.jt .s:last-child:before{right:0}
.jt .s .n{position:absolute;top:0;left:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--green);color:var(--green);display:grid;place-items:center;font-family:var(--mono);font-size:11px;background:var(--bg)}
.jt .s h3{font-size:14px}
.jt .s p{font-size:12px;color:var(--ink-2);margin-top:6px}
.jt .s p b{color:var(--muted);font-weight:400;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block}
.rule{display:grid;grid-template-columns:140px repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.rule>*{padding:12px;border-radius:12px;background:var(--pn-2)}
.rule .h{background:none;padding:4px 12px}
.rule b{color:var(--ink);font-weight:500;background:none;padding:12px 0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--pn);border:1px solid var(--line-2);border-radius:22px;width:min(600px,100%);position:relative;overflow:hidden}
.modal:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--rainbow)}
.modal header{padding:22px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal header h2{font-size:22px}
.modal .body{padding:16px 22px;display:flex;flex-direction:column;gap:16px}
.modal .body .seg{align-self:flex-start}
.modal footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.btn.primary{background:var(--green);border-color:var(--green);color:#03220F;font-weight:500}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-size:12.5px;color:var(--ink-2)}
.fld select,.fld input,.fld textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scale{display:flex;gap:6px}
.scale button,.opt{border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:13px}
.scale button{width:42px;font-family:var(--mono)}
.scale button[aria-pressed="true"],.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#03220F}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12.5px;color:var(--red);margin-right:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#03220F;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{max-width:1320px;margin:0 auto;padding:0 28px 30px;display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* v5 */
.vr{border:1px solid transparent;border-radius:12px}
.vr.on{border-color:var(--line-2);background:var(--pn-2)}
.vr-h{width:100%;background:none;border:0;display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:6px 10px;align-items:center;padding:10px 12px;text-align:left;font-size:13.5px;border-radius:12px}
.vr-h:hover{background:var(--pn-2)}
.vr-h .mono{text-align:right;font-size:14px}
.vr-b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.vr-b i{display:block;height:100%;border-radius:3px;background:var(--violet)}
.topb{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--cyan);border:1px solid rgba(61,232,255,.4);border-radius:999px;padding:1px 8px;letter-spacing:.06em}
.topb i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.vr-x{padding:4px 12px 12px;display:flex;flex-direction:column;gap:4px}
.vr-c{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;text-align:left;font-size:12.5px}
.vr-c:hover .stt{color:var(--ink)}
.why2{font-size:13px;color:var(--ink);display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--k) 9%,transparent);border-left:2px solid var(--k);border-radius:8px;padding:9px 11px}
.dm tr.tot td{border-top:1px solid var(--line-2);padding-top:10px}
.dm tr.tot{cursor:default}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--green);color:#03220F;box-shadow:0 0 16px rgba(57,242,138,.25);font-weight:500}
.seg button[aria-selected="true"] .dt{box-shadow:0 0 0 2px #03220F}
.side{transition:width .2s}
.app.mini{grid-template-columns:72px minmax(0,1fr)}
.app.mini .brand span.cap,.app.mini .nav a .lbl,.app.mini .sfoot,.app.mini .nav .cnt{display:none}
.app.mini .nav a{justify-content:center;padding:11px 0}
.app.mini #regBtn{padding:9px 0;font-size:0}
.app.mini #regBtn:before{content:"+";font-size:18px}
.app.mini .brand{align-items:center;padding:0}
.colbtn{background:var(--pn);border:1px solid var(--line-2);border-radius:999px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2);font-size:13px;position:absolute;right:-14px;top:30px;z-index:5}
.colbtn:hover{color:var(--ink);border-color:var(--ink-2)}
.side{position:sticky}
.app.mini main{max-width:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fact{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--pn)}
.fact .v{font-size:15px;margin-top:6px}
.fact .obs{margin-top:8px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:8px}
.fact .obs b{color:var(--cyan);font-weight:500}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 14px;border-right:1px solid var(--line);background:rgba(8,8,10,.88);display:flex;flex-direction:column;gap:24px}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 12px}
.side .nav{flex-direction:column;background:none;border:0;padding:0;margin:0;border-radius:0;gap:2px}
.side .nav a{padding:10px 12px;border-radius:12px;font-size:13.5px}
.side .nav a.on{background:var(--pn-2)}
.side .nav .sep{height:1px;background:var(--line);margin:10px 12px}
.sfoot{margin-top:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:0 12px;line-height:1.8}
main{margin:0 auto;width:100%;justify-self:stretch}
.hello{font-size:48px;font-weight:600;letter-spacing:-.045em;margin-top:6px;background:linear-gradient(100deg,#FFFFFF 0%,#D9FBFF 35%,#3DE8FF 62%,#39F28A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(61,232,255,.28));width:fit-content}
.pcards{align-items:start}
.pc{padding:0;gap:0}
.pc-h{background:none;border:0;text-align:left;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%}
.pc:before{display:none}
.why3{font-size:13px;color:var(--ink);background:var(--pn-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.bar2{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.bar2 i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#A78BFA,#3DE8FF)}

.orig{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:7px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);white-space:nowrap}
.orig i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.logl{display:grid;grid-template-columns:52px 14px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:13.5px}
.logl:first-child{border-top:0}
.logl .d{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding-top:3px}
.logl .nd{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--c);box-shadow:0 0 10px var(--c)}
.logl .q{margin-top:6px;font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--c);padding:2px 0 2px 10px;font-style:italic}
.logl .ctx{margin-top:8px;font-size:12.5px;color:#FFD98A;background:rgba(255,194,75,.06);border:1px dashed rgba(255,194,75,.35);border-radius:9px;padding:7px 10px}
.sug{border:1px solid rgba(255,194,75,.35);background:linear-gradient(90deg,rgba(255,194,75,.07),transparent);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.sug+.sug{margin-top:10px}
.sug .q{margin-top:6px;font-size:12.5px;color:var(--ink-2);font-style:italic}
.src{border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;margin-top:10px}
.src .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.src ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}.src li{margin-top:4px}
.pf{font-family:var(--sans);font-size:12.5px;padding:6px 11px;border-radius:9px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer}.pf .mono{color:var(--ink-2);margin-left:4px}.pf[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}

.sq{border:1px solid var(--line-2);border-radius:14px;padding:16px 18px}
.sq+.sq{margin-top:12px}
.sq.rev{border-color:rgba(255,92,154,.4);background:linear-gradient(90deg,rgba(255,92,154,.06),transparent 60%)}
.sqa{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 16px;margin-top:12px;font-size:13.5px}
.sqa dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#FF8FB8;padding-top:2px}
.sqa dd{margin:0}
.chk{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chk .c{border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;font-size:13px}
.chk .c .cap{display:block;margin-bottom:6px}
.chk .c.ok{border-color:rgba(57,242,138,.45);background:rgba(57,242,138,.05)}
.chk .c.no{border-color:rgba(255,194,75,.45);background:rgba(255,194,75,.05)}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{font-family:var(--sans);font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer}
.tg button[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sqf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.pers{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pers button{font-family:var(--sans);font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer}
.pers button[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.pobs{width:100%;margin-top:12px;min-height:72px;background:rgba(255,255,255,.02);border:1px solid var(--line-2);border-radius:10px;color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:10px 12px;resize:vertical}
.obj{font-size:19px;line-height:1.45;margin-top:8px}
.mctx{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.mctx div{font-size:12.5px;color:var(--ink-2)}.mctx b{color:#FFD98A;font-weight:500}
.obs2{margin-top:8px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:8px}.obs2 b{color:var(--cyan);font-weight:500}
.strip .lab{font-weight:500}
.radar-legend{font-size:11.5px}
.pc .rs i{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none;display:inline-block}
.pc .rs{color:var(--ink-2)}
.pc-x{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.pc-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px}
.pc-k .cap{display:block;margin-bottom:2px}
.pc.open{border-color:var(--line-2)}
.stt{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.stt i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pc .rs{color:var(--muted)}
.zone{border:1px solid var(--line);border-radius:14px;padding:14px}.zone p{font-size:13px;color:var(--ink-2);margin-top:8px}
.cflow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cf-col{display:flex;flex-direction:column;gap:8px}
.cf-pill{border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;font-size:13px}
.cf-arr{color:var(--muted);font-size:20px}
.cf-box{border:1px solid var(--line-2);border-radius:14px;padding:14px;max-width:220px}.cf-box p{font-size:13px;margin-top:6px;color:var(--ink-2)}.cf-box b{color:var(--ink);font-weight:500}
.cf-out{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tip{position:fixed;pointer-events:none;background:#F1F0F5;color:#08080A;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.4;z-index:70;opacity:0;transition:opacity .1s;max-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:14px}.side .nav{flex-direction:row;overflow-x:auto}.side .nav .sep{display:none}.sfoot{display:none}}

/* v9: números e faixas mais compactos */
.strip .cell{padding:14px 18px 16px;gap:4px}
.strip .lab{margin-top:6px;font-size:12.5px}
.strip .big{font-size:26px;letter-spacing:-.03em}
.strip .big small{font-size:13px}
.strip .sm{font-size:11px}
.stg{padding:14px 16px 16px;gap:8px}
.stg .n{font-size:28px}
.stg .nm{font-size:12.5px}
.kpi2 .v{font-size:26px}
.gauge svg{width:140px}
@media (max-width:1150px){.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}.stages{grid-template-columns:repeat(4,minmax(0,1fr))}.stg{border-bottom:1px solid var(--line)}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip .cell{border-bottom:1px solid var(--line)}.g2,.g21,.g12,.g3,.q4{grid-template-columns:1fr}.jt{grid-template-columns:repeat(2,minmax(0,1fr))}.jt .s:before{display:none}}
@media (max-width:760px){.top .in{flex-wrap:wrap;padding:10px 16px}.nav{order:3;width:100%;margin-left:0}main{padding:22px 16px 60px}.pcards,.strip,.stages{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.evd{grid-template-columns:1fr}.ins{grid-template-columns:1fr}.two{grid-template-columns:1fr}.rule{grid-template-columns:1fr}.res .lbls{grid-template-columns:1fr 1fr;gap:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style>

}

function smooth(P){const n=P.length;if(n<2)return '';const dx=[],ms=[],t=[];for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];ms[i]=(P[i+1][1]-P[i][1])/dx[i]}t[0]=ms[0];t[n-1]=ms[n-2];for(let i=1;i<n-1;i++)t[i]=ms[i-1]*ms[i]<=0?0:(ms[i-1]+ms[i])/2;let d=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=` C${P[i][0]+h},${P[i][1]+t[i]*h} ${P[i+1][0]-h},${P[i+1][1]-t[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`}return d}

  let g=`<defs><filter id="gl${id}" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>${o.s.map((s,k)=>`<linearGradient id="a${id}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".32"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  (o.ticks||[]).forEach(v=>g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-10}" y="${Y(v)+4}" text-anchor="end">${o.yf?o.yf(v):v}</text>`);
  L.forEach((l,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${l}</text>`);

/* ---------- CLIENTE ---------- */
V.cliente=()=>{
  const p=P(selP)||S.projetos[0],c=cor(p),w=pior(p),prox=p.marcos.find(m=>!m.v),d=p.marcos.filter(m=>m.v),fbs=S.feedbacks.filter(f=>f.p===p.id),opps=S.opps.filter(o=>o.p===p.id);
  const T=[['geral','Visão geral'],['plano','Plano de sucesso'],['voz','Voz do cliente'],['opps','Oportunidades'],['reg','Registros e fontes']];const pend=(S.sugs||[]).filter(x=>x.p===p.id&&x.st==='pendente'),pf=p.persona&&PERF[p.persona.perfil];
  const leitura=c==='g'?`Dentro do combinado em todos os eixos.${prox&&prox.pico?' O próximo marco é um pico de valor: momento da pergunta de futuro.':''}`:`${NOME[c]} por <b>${w.l.toLowerCase()}</b>: ${esc(w.t.charAt(0).toLowerCase()+w.t.slice(1))}. <span class="ink2">${REC[w.k]}</span>`;
  let b='';
  if(ctab==='geral')b=`<div class="read"><span class="cap">Leitura de CS</span><span>${leitura}</span></div>${pend.length?`<div class="sug mt"><div><span class="orig" style="--c:#FFC24B"><i></i>taqCITi</span> <span style="margin-left:8px">${pend.length} ${pend.length>1?'sugestões':'sugestão'} das reuniões esperando sua confirmação. Nada entra no painel sem você.</span></div><button class="btn sm" data-ctab="reg">Revisar</button></div>`:''}
    <div class="grid g12 mt"><section class="pn"><h2>Saúde em cinco eixos</h2><div style="display:flex;justify-content:center;margin-top:6px">${spider(p)}</div></section>
    <section class="pn"><div class="row between"><h2>Notas por marco</h2><button class="btn sm primary" data-reg="marco" data-p="${p.id}">Registrar marco</button></div>${d.length?`<div class="mt">${lines({labels:d.map(m=>m.n),ymin:1,ymax:5,ticks:[1,2,3,4,5],ml:30,H:240,s:[{v:d.map(m=>m.v),c:'#A78BFA',nome:'Valor percebido'},{v:d.map(m=>m.a),c:'#3DE8FF',nome:'Andamento'},{v:d.map(m=>m.c),c:'#FFC24B',nome:'Confiança'}],aria:'Notas por marco'})}</div><div class="legend"><span><i class="ln" style="background:#A78BFA"></i>Valor percebido</span><span><i class="ln" style="background:#3DE8FF"></i>Andamento</span><span><i class="ln" style="background:#FFC24B"></i>Confiança</span></div>`:'<p class="sub mt">As notas aparecem a partir do primeiro marco.</p>'}
      ${(pf||d.some(m=>m.obs))?`<div class="mctx">${pf?`<div><span class="orig" style="--c:${pf[1]}"><i></i>Perfil ${pf[0].toLowerCase()}</span> <span style="margin-left:6px">${esc(p.persona.obs||pf[2])}</span></div>`:''}${d.filter(m=>m.obs).map(m=>`<div><b>${esc(m.n)}:</b> ${esc(m.obs)}</div>`).join('')}</div>`:''}
      ${prox?`<div class="row between" style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px"><span><span class="cap">Próximo marco</span><br>${esc(prox.n)} · <span class="mono">${fmtD(prox.d)}</span></span>${prox.pico?chip('y','pico de valor'):''}</div>`:''}</section></div>
    ${p.aguardando.length?`<section class="pn mt"><h2>Aguardando o cliente</h2><div style="margin-top:10px">${p.aguardando.map(a=>{const c2=a.d>10?'r':a.d>5?'y':'g';return `<div class="waitb"><span>${esc(a.i)} ${a.trava?chip('r','trava a fase'):''}</span><span class="tr"><i style="width:${Math.min(a.d/15,1)*100}%;background:${NEON[c2]};box-shadow:0 0 10px ${NEON[c2]}"></i></span><span class="mono" style="text-align:right">${a.d}d</span></div>`}).join('')}</div></section>`:''}`;
  if(ctab==='plano'){const pl=p.plano;b=`${pl?`<section class="pn" style="border-color:rgba(61,232,255,.3)"><div class="row between"><span class="cap" style="color:var(--cyan)">Objetivo do cliente</span><span class="row">${origT('taq')}${origT('voce')}<span class="cap">${esc(pl.reun)} · ${fmtD(pl.d)}</span></span></div><div class="obj">${esc(pl.obj)}</div><p class="sub" style="margin-top:8px">Extraído da transcrição da reunião de sucesso e revisado por você. <button class="link" data-ctab="reg">Ver fonte</button></p></section>`:`<div class="read"><span class="cap">Plano de sucesso</span><span>Ainda não definido. Ele nasce na reunião de sucesso: a transcrição gera um rascunho e você revisa antes de valer.</span></div>`}
    <div class="grid g12 mt"><section class="pn"><h2>O que o cliente valoriza</h2><div class="row mt">${p.temas.map(t=>chip('v',t)).join('')||'<span class="ink2">Definido na reunião de sucesso.</span>'}</div><div class="cap" style="margin-top:22px">Critérios de sucesso</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${p.criterios.map(x=>`<div class="row" style="font-size:13.5px"><i class="dt" style="background:var(--cyan);box-shadow:0 0 8px var(--cyan)"></i>${esc(x)}</div>`).join('')||'<span class="ink2">—</span>'}</div><div class="cap" style="margin-top:22px">Decisor</div><div style="font-size:13.5px;margin-top:6px">${esc(p.decisor)}</div></section>
    <section class="pn"><h2>Indicadores do plano</h2><div class="gauges">${p.inds.map(i=>{const t=Math.abs(i.meta-i.antes)||1,f=i.hoje==null?0:Math.min(1,Math.abs(i.hoje-i.antes)/t);return gauge(f,i.hoje==null?'—':Math.round(f*100)+'%',esc(i.n),`antes ${i.antes}${i.u} · hoje ${i.hoje??'—'}${i.hoje==null?'':i.u} · meta ${i.meta}${i.u}`)}).join('')||'<p class="sub">Definidos no Discovery, com Produto.</p>'}</div><p class="sub" style="margin-top:14px">Porcentagem = quanto do caminho entre o antes e a meta já foi percorrido.</p></section></div>
    <section class="pn mt"><div class="row between"><div><h2>Perfil do cliente</h2><p class="sub">Contexto para ler as notas. Não altera nenhuma nota nem a cor de saúde.</p></div>${pf?`<span class="orig" style="--c:${pf[1]}"><i></i>${pf[0]}</span>`:''}</div>
      <div class="pers">${Object.entries(PERF).map(([k,v])=>`<button style="--c:${v[1]}" data-persona="${k}" aria-pressed="${p.persona&&p.persona.perfil===k}">${v[0]}</button>`).join('')}</div>${pf?`<p class="sub" style="margin-top:8px">${pf[2]}</p>`:''}
      <textarea class="pobs" id="pobs" data-pid="${p.id}" placeholder="Ex.: cobra prazo por escrito; nota 3 dele costuma vir com entrega boa.">${esc(p.persona?p.persona.obs:'')}</textarea></section>`}
  if(ctab==='voz'){const tc=TEMAS.map(t=>({t,n:fbs.filter(f=>f.tema===t).length})).filter(x=>x.n);b=`<div class="grid g12"><section class="pn"><h2>Temas citados</h2><div style="display:flex;justify-content:center;margin-top:10px">${ring(tc.map((x,i)=>({v:x.n,c:['#A78BFA','#3DE8FF','#FFC24B','#FF4D6D','#39F28A','#2F7BFF','#FF5C9A'][i],l:x.t})),190,12,String(fbs.length),'registros')}</div><div class="legend" style="justify-content:center">${tc.map((x,i)=>`<span><i class="dt" style="background:${['#A78BFA','#3DE8FF','#FFC24B','#FF4D6D','#39F28A','#2F7BFF','#FF5C9A'][i]}"></i>${x.t}</span>`).join('')}</div></section>
    <section class="pn"><div class="row between"><h2>O que o cliente disse</h2><button class="btn sm primary" data-reg="feedback" data-p="${p.id}">Registrar</button></div><div style="margin-top:10px">${fbs.map(f=>`<div class="fbl"><span class="d">${fmtD(f.d)}</span><span class="b" style="background:${f.nat==='elogio'?'var(--green)':f.st==='sem destino'?'var(--amber)':'var(--violet)'}"></span><div>${esc(f.t)}<div class="row" style="margin-top:6px">${chip('n',f.tema)}${chip(f.st==='sem destino'?'y':f.st==='em ação'?'v':'g',f.st)}</div></div></div>`).join('')||'<p class="sub">Nenhum registro ainda.</p>'}</div></section></div>`}
  if(ctab==='opps'){const sq=(S.sq||[]).filter(x=>x.p===p.id),rev=sq.filter(x=>x.tipo==='opp'&&x.st==='revisar'),hip=sq.filter(x=>x.tipo==='opp'&&x.st==='hipotese'),ods=sq.filter(x=>x.tipo==='od'&&x.st==='revisar'),verde=cor(p)==='g';
    const card=x=>{const k=x.chk||{},rec=k.rec,dec=k.dec;return `<div class="sq ${x.st==='revisar'?'op':''}"><div class="row between">${x.st==='revisar'?`<span class="tag" style="--c:#3DE8FF"><b>↗</b>Oportunidade de expansão · a revisar</span>`:chip('n','Hipótese')}<span class="row">${origT('squad')}<span class="cap">${esc(x.task)} · ${fmtD(x.d)}</span></span></div>
      <dl class="sqa"><dt>Problema · área</dt><dd><b style="font-weight:500">${esc(x.prob)}</b> <span class="ink2">· ${esc(x.area)}</span></dd><dt>Evidência</dt><dd>${esc(x.evid)}</dd><dt>Impacto</dt><dd>${esc(x.imp)}</dd><dt>Quem sente</dt><dd>${esc(x.quem)}</dd></dl>
      <div class="chk"><div class="c ${rec==='s'?'ok':rec==='n'?'no':''}"><span class="cap">O cliente reconhece?</span><div class="tg">${[['s','Sim','#39F28A'],['n','Não','#FFC24B'],['a','Ainda não perguntei','#A78BFA']].map(([v,l,c])=>`<button style="--c:${c}" data-chk="${x.id}:rec:${v}" aria-pressed="${rec===v}">${l}</button>`).join('')}</div></div>
        <div class="c ${dec?'ok':''}"><span class="cap">Quem decide</span><div style="margin-bottom:6px">${esc(p.decisor)}</div><div class="tg"><button style="--c:#39F28A" data-chk="${x.id}:dec:1" aria-pressed="${!!dec}">Confirmado</button></div></div>
        <div class="c ${verde?'ok':'no'}"><span class="cap">Momento da conta</span>${chip(cor(p),NOME[cor(p)])}<div class="ink2" style="font-size:12px;margin-top:6px">${verde?'Pode abordar no próximo momento de valor.':'Qualifica, mas só aborda quando voltar ao verde.'}</div></div></div>
      <div class="sqf"><span class="ink2" style="font-size:12.5px">${rec==='s'?'Pronta para qualificar.':rec==='n'?'Fica no mapa como hipótese.':'Pergunte no próximo marco ou checagem, de forma aberta.'}</span><div class="row">${rec==='s'?`<select data-serv="${x.id}" aria-label="Serviço provável">${['Discovery','Delivery','Synergy','Retainer'].map(v=>`<option ${(x.serv||'Discovery')===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn sm primary" data-qual="${x.id}:q">Qualificar</button>`:rec==='n'&&x.st==='revisar'?`<button class="btn sm" data-qual="${x.id}:h">Manter como hipótese</button>`:''}</div></div></div>`};
    b=`${rev.length?`<section class="pn" style="border-color:rgba(61,232,255,.35)"><div class="row between"><div><h2><span style="color:#3DE8FF">↗</span> Oportunidades a revisar</h2><p class="sub">Oportunidades vindas da task do squad. Você qualifica; só as qualificadas entram no forecast.</p></div><span class="mono" style="color:#3DE8FF;font-size:22px">${rev.length}</span></div><div class="mt">${rev.map(card).join('')}</div></section>`:''}
    ${ods.length?`<section class="pn ${rev.length?'mt':''}" style="border-color:rgba(255,194,75,.4)"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:1;min-width:0"><h2><span style="color:#FFC24B">✦</span> Overdelivery: vale o esforço?</h2><p class="sub">O squad pede sua avaliação antes de investir esforço extra. Só entra na curadoria com os cinco campos preenchidos. Você decide se segue, se o esforço vai para algo que o cliente valoriza mais, ou se não segue.</p></div><span class="mono" style="color:#FFC24B;font-size:22px">${ods.length}</span></div>
      ${ods.map(x=>{const alvo=x.alvo;return `<div class="sq od mt"><div class="row between"><span class="tag" style="--c:#FFC24B"><b>✦</b>Ideia de overdelivery · a revisar</span><span class="row">${origT('squad')}<span class="cap">${esc(x.task)} · ${fmtD(x.d)}</span></span></div>
        <dl class="sqa"><dt style="color:#FFD98A">O quê</dt><dd><b style="font-weight:500">${esc(x.ideia)}</b></dd><dt style="color:#FFD98A">Por quê</dt><dd>${esc(x.porque)}</dd><dt style="color:#FFD98A">Impacto</dt><dd>${esc(x.imp)}</dd><dt style="color:#FFD98A">Resultado esperado</dt><dd><span style="color:#FFD98A">◎</span> ${esc(x.res)}</dd><dt style="color:#FFD98A">Esforço</dt><dd>${esc(x.esf)}</dd></dl>
        <div class="chk"><div class="c"><span class="cap">O que o cliente valoriza</span><div class="row">${p.temas.map(t=>chip('v',t)).join('')||'<span class="ink2">Sem plano de sucesso</span>'}</div></div>
          <div class="c"><span class="cap">Eixo mais fraco hoje</span>${chip(pior(p).c,pior(p).l)}<div class="ink2" style="font-size:12px;margin-top:6px">${esc(pior(p).t)}</div></div>
          <div class="c"><span class="cap">Critérios da curadoria</span><div style="font-size:12.5px;line-height:1.5">Ligada ao contexto · benefício percebido · sem escopo recorrente</div></div></div>
        <div class="sqf"><div class="row"><span class="cap">Redirecionar o esforço para</span><div class="tg">${p.temas.map(t=>`<button style="--c:#A78BFA" data-alvo="${x.id}:${t}" aria-pressed="${alvo===t}">${t}</button>`).join('')}</div></div><div class="row"><button class="btn sm" data-od="${x.id}:d">Não seguir</button>${alvo?`<button class="btn sm" style="border-color:#A78BFA;color:#A78BFA" data-od="${x.id}:r">Redirecionar para ${esc(alvo)}</button>`:''}<button class="btn sm primary" data-od="${x.id}:a">Vale o esforço</button></div></div></div>`}).join('')}</section>`:''}
    <div class="grid g2 ${rev.length||ods.length?'mt':''}"><section class="pn"><div class="row between"><h2>Mapa de oportunidades</h2><button class="btn sm primary" data-reg="oportunidade" data-p="${p.id}">Registrar</button></div><div style="margin-top:14px;display:flex;flex-direction:column;gap:14px">${opps.map(o=>`<div><div class="row between" style="font-size:13.5px"><span>${o.tipo} · ${o.serv}</span><span class="mono ink2">${brl(o.valor)}</span></div>${o.prob?`<div class="ink2" style="font-size:12.5px;margin-top:4px">${esc(o.prob)}</div>`:''}<div class="tr" style="margin-top:8px;height:8px"><i style="width:${(o.etapa+1)/4*100}%;background:linear-gradient(90deg,#A78BFA,#3DE8FF)"></i></div><div class="row between" style="margin-top:4px"><span class="cap">${ETAPAS[o.etapa][0]}${o.etapa===0?' · fora do forecast':''}</span><span class="cap">${o.fonte}</span></div></div>`).join('')||'<p class="sub">Nenhuma ainda.</p>'}</div>
      ${hip.length?`<div class="cap" style="margin-top:22px">Hipóteses</div>${hip.map(x=>`<div class="row between" style="font-size:13px;margin-top:8px"><span>${esc(x.prob)}</span><button class="link" data-qual="${x.id}:r">Reabrir</button></div>`).join('')}`:''}</section>
    <section class="pn"><h2>Dores fora do escopo</h2><div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">${p.dores.map(x=>`<div class="row" style="font-size:13.5px"><i class="dt" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></i>${esc(x)}</div>`).join('')}</div><p class="sub" style="margin-top:16px">Decisor: ${esc(p.decisor)}</p>
      </section></div>
`}
  if(ctab==='reg'){const L=[];const cr=p.crm;
    if(cr)L.push({d:cr.d,o:'crm',t:`Card criado a partir da venda ganha · ${brl(cr.valor)} · ${esc(cr.vend)}`,x:esc(cr.ctx)});
    if(p.plano)L.push({d:p.plano.d,o:'taq',t:'Plano de sucesso: rascunho gerado da transcrição e revisado por você',x:esc(p.plano.obj)});
    p.marcos.filter(m=>m.v).forEach(m=>L.push({d:m.d,o:'voce',t:`Marco “${esc(m.n)}” · valor ${m.v}, andamento ${m.a}, confiança ${m.c}`,q:m.f,ctx:m.obs}));
    if(p.checagem)L.push({d:p.checagem.d,o:'voce',t:`Checagem com ${esc(p.gerente)} · relacionamento ${p.checagem.rel} · decisor ${p.checagem.decisor?'presente':'ausente'}`});
    fbs.forEach(f=>L.push({d:f.d,o:f.src||'voce',t:`Feedback · ${f.tema}: ${esc(f.t)}${f.src?' <span class="cap">· confirmado por você</span>':''}`,q:f.src?f.q:null}));
    (S.sugs||[]).filter(x=>x.p===p.id&&x.st==='confirmada'&&x.tipo==='decisor').forEach(x=>L.push({d:x.d,o:'taq',t:`${x.t} <span class="cap">· confirmado por você</span>`,q:x.q}));
    p.aguardando.forEach(a=>L.push({d:'2027-03-15',o:'crono',t:`Aguardando o cliente: ${esc(a.i)} · ${a.d} dias`}));
    opps.forEach(o=>L.push({d:'2027-03-01',o:o.etapa>=1?'crm':'voce',t:`Oportunidade · ${o.tipo} de ${o.serv} · ${ETAPAS[o.etapa][0]}`}));
    (S.sq||[]).filter(x=>x.p===p.id).forEach(x=>L.push({d:x.d,o:'squad',t:x.tipo==='opp'?`Oportunidade · ${esc(x.prob)} <span class="cap">· ${({revisar:'a revisar',qualificada:'qualificada',hipotese:'hipótese'})[x.st]}</span>`:`Ideia de overdelivery · ${esc(x.ideia)} <span class="cap">· ${({revisar:'a revisar',aprovada:'vale o esforço',descartada:'não seguir',redirecionada:'redirecionada para '+(x.alvo||'')})[x.st]}</span>`,x:x.tipo==='opp'?'Evidência: '+esc(x.evid):esc(x.porque)}));
    L.sort((a,b)=>b.d.localeCompare(a.d));
    const F=window.rOrig||'todas',LL=F==='todas'?L:L.filter(x=>x.o===F);
    b=`${pend.length?`<section class="pn" style="border-color:rgba(255,194,75,.35)"><div class="row between"><div><h2>Sugestões do taqCITi</h2><p class="sub">Extraídas das transcrições. Só entram nos registros depois que você confirma.</p></div><span class="mono" style="color:#FFC24B;font-size:22px">${pend.length}</span></div><div class="mt">${pend.map(x=>`<div class="sug"><div><div class="row">${chip(x.tipo==='oportunidade'?'c':x.tipo==='decisor'?'y':'v',x.tipo==='feedback'?'Feedback · '+x.tema:x.tipo==='oportunidade'?'Oportunidade · '+x.serv:'Decisor')}<span class="cap">${esc(x.reun)} · ${fmtD(x.d)}</span></div><div style="margin-top:8px;font-size:14px">${esc(x.t)}</div><div class="q">Trecho: ${esc(x.q)}</div></div><div class="row"><button class="btn sm" data-sug="${x.id}:d">Descartar</button><button class="btn sm primary" data-sug="${x.id}:c">Confirmar</button></div></div>`).join('')}</div></section>`:''}

      <div class="row" style="margin-top:12px;gap:6px">${[['todas','Todas','#E8ECF5'],...Object.entries(ORIG).filter(([k])=>k!=='form'&&(k!=='squad'||L.some(x=>x.o==='squad'))).map(([k,v])=>[k,v[0],v[1]])].map(([k,l,c])=>`<button class="pf" style="--c:${c}" data-orig="${k}" aria-pressed="${F===k}">${l} <span class="mono">${k==='todas'?L.length:L.filter(x=>x.o===k).length}</span></button>`).join('')}</div>
      <div style="margin-top:8px">${LL.map(x=>`<div class="logl" style="--c:${ORIG[x.o][1]}"><span class="d">${fmtD(x.d)}</span><span class="nd"></span><div><div class="row between" style="align-items:flex-start"><span>${x.t}</span>${origT(x.o)}</div>${x.x?`<div style="margin-top:4px;font-size:12.5px;color:var(--ink-2)">${x.x}</div>`:''}${x.q?`<div class="q">“${esc(x.q.replace(/^“|”$/g,''))}”</div>`:''}${x.ctx?`<div class="ctx">Contexto: ${esc(x.ctx)}</div>`:''}</div></div>`).join('')||'<p class="sub">Nada desta origem ainda.</p>'}</div></section>
    <section class="pn"><h2>Fontes</h2><p class="sub">Onde cada informação nasceu, para você conferir.</p>
      ${cr?`<div class="src" style="border-color:rgba(167,139,250,.35)"><div class="h">${origT('crm')}<span class="cap">venda em ${fmtD(cr.d)}</span></div><div style="margin-top:8px;font-size:13.5px">${esc(cr.ctx)}</div><ul>${cr.prom.map(x=>`<li>Prometido na venda: ${esc(x)}</li>`).join('')}${p.dores.map(x=>`<li>Dor fora do escopo: ${esc(x)}</li>`).join('')}</ul><button class="link" style="margin-top:8px">Abrir card no CITi Flow</button></div>`:''}

  rows.forEach(r=>{const crit=r.val>=.4&&r.nota<3.5,force=r.val>=.4&&r.nota>=3.5,c=crit?'#FF4D6D':force?'#39F28A':'#A78BFA',x=X(Math.max(r.val,.04)),y=Y(r.nota),rad=10+r.fb*4;
    g+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="1.5" filter="url(#bq)" class="${crit?'pulse':''}"/><circle cx="${x}" cy="${y}" r="4" fill="${c}"/><text x="${x}" y="${y-rad-6}" text-anchor="middle" style="fill:var(--ink);font-family:var(--sans);font-size:12px">${r.t}</text>`});

  if(mT==='marco'){const prox=P(d.p).marcos.find(m=>!m.v);f=`<div class="two"><div class="fld"><label for="f-p">Cliente</label><select id="f-p">${popts(d.p)}</select></div><div class="fld"><label for="f-n">Marco</label><input id="f-n" value="${esc(d.n??(prox?prox.n:''))}"></div></div>

    <div class="fld"><span class="lb">Andamento · sua nota</span>${scale('a',d.a)}<span class="hint">5: nenhuma preocupação · 1: pede mudança na condução</span></div>
    <div class="fld"><span class="lb">Confiança · nota do cliente</span>${scale('c',d.c)}</div>
    <div class="fld"><label for="f-f">A fala do cliente</label><textarea id="f-f" placeholder="Já usamos o painel na reunião de segunda.">${esc(d.f||'')}</textarea></div>
    <div class="fld"><label for="f-obs">Contexto da nota (opcional)</label><textarea id="f-obs" placeholder="Cliente mais rígido; a entrega foi boa.">${esc(d.obs||'')}</textarea><span class="hint">Não muda a nota. Aparece ao lado dela no histórico.</span></div>`}
  if(mT==='feedback')f=`<div class="fld"><label for="f-p">Cliente</label><select id="f-p">${popts(d.p)}</select></div><div class="fld"><span class="lb">Tema</span><div class="opts">${TEMAS.map(t=>`<button type="button" class="opt" data-tema="${t}" aria-pressed="${d.tema===t}">${t}</button>`).join('')}</div></div>
    <div class="fld"><span class="lb">Natureza</span><div class="opts">${Object.entries(NAT).map(([k,v])=>`<button type="button" class="opt" data-nat="${k}" aria-pressed="${d.nat===k}">${v[0]}</button>`).join('')}</div>${d.nat?`<span class="hint">Destino: ${NAT[d.nat][1]}</span>`:''}</div>
    <div class="fld"><label for="f-t">O que o cliente disse</label><textarea id="f-t">${esc(d.t||'')}</textarea></div>`;
  if(mT==='oportunidade'){const sv=d.serv||'Delivery';f=`<div class="two"><div class="fld"><label for="f-p">Cliente</label><select id="f-p">${popts(d.p)}</select></div><div class="fld"><label for="f-serv">Serviço</label><select id="f-serv">${Object.keys(TICKET).map(t=>`<option ${sv===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="fld"><span class="lb">Fonte</span><div class="opts">${FONTES.map(t=>`<button type="button" class="opt" data-fonte="${t}" aria-pressed="${d.fonte===t}">${t}</button>`).join('')}</div></div>
    <div class="two"><div class="fld"><label for="f-et">Etapa</label><select id="f-et">${ETAPAS.map((e,i)=>`<option value="${i}" ${+(d.etapa||0)===i?'selected':''}>${e[0]}</option>`).join('')}</select></div><div class="fld"><label for="f-mes">Janela do cliente</label><select id="f-mes">${['abr','mai','jun','jul','ago'].map(m=>`<option ${d.mes===m?'selected':''}>${m}</option>`).join('')}</select></div></div>
    <p class="hint">Valor pelo ticket médio: ${brl(TICKET[sv])}.</p>`}
  if(mT==='checagem')f=`<div class="fld"><label for="f-p">Cliente</label><select id="f-p">${popts(d.p)}</select></div><div class="fld"><span class="lb">O decisor esteve na última reunião combinada?</span><div class="opts"><button type="button" class="opt" data-dec="1" aria-pressed="${d.dec===true}">Sim</button><button type="button" class="opt" data-dec="0" aria-pressed="${d.dec===false}">Não</button></div></div>
    <div class="fld"><span class="lb">Relacionamento · sua nota</span>${scale('rel',d.rel)}<span class="hint">5: elogia o time · 1: pediu escalonamento</span></div>`;
  if(mT==='overdelivery')f=`<div class="fld"><label for="f-p">Cliente</label><select id="f-p">${popts(d.p)}</select></div><div class="fld"><label for="f-t">O que foi entregue além do escopo</label><textarea id="f-t" placeholder="Alerta automático de ruptura no painel.">${esc(d.t||'')}</textarea></div><p class="hint">Critérios da curadoria: ligado ao contexto do cliente, benefício que ele percebe, sem criar expectativa de escopo recorrente.</p>`;
  document.getElementById('mTitle').textContent=MT.find(x=>x[0]===mT)[1];
  document.getElementById('mBody').innerHTML=`<div class="seg" role="tablist" style="margin-bottom:0">${MT.map(([k,l])=>`<button role="tab" data-mt="${k}" aria-selected="${mT===k}">${l}</button>`).join('')}</div><p class="ink2" style="font-size:13px">${MPQ[mT]}</p>${f}`;
  document.getElementById('mErr').textContent='';}
function mO(t,p){mT=t||'marco';mD={p:p||selP};mR();document.getElementById('scrim').classList.add('open')}
const mC=()=>document.getElementById('scrim').classList.remove('open');
function rd(){['p','n','f','t','serv','mes','obs'].forEach(k=>{const e=document.getElementById('f-'+k);if(e)mD[k]=e.value});const e=document.getElementById('f-et');if(e)mD.etapa=+e.value}
const mb=document.getElementById('mBody');
mb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rd();if(b.dataset.mt){mT=b.dataset.mt;mD={p:mD.p}}if(b.dataset.sc)mD[b.dataset.sc]=+b.dataset.v;if(b.dataset.tema)mD.tema=b.dataset.tema;if(b.dataset.nat)mD.nat=b.dataset.nat;if(b.dataset.fonte)mD.fonte=b.dataset.fonte;if(b.dataset.dec)mD.dec=b.dataset.dec==='1';mR()});
mb.addEventListener('change',e=>{rd();if(['f-serv','f-p'].includes(e.target.id))mR()});
function push(p){const c=cor(p);if(p.hist[p.hist.length-1]!==c){p.hist.push(c);p.hist.shift()}}
document.getElementById('mSave').onclick=()=>{rd();const d=mD,p=P(d.p),err=t=>document.getElementById('mErr').textContent=t;
  if(mT==='marco'){if(!d.n)return err('Dê um nome ao marco.');if(!d.v||!d.a||!d.c)return err('Preencha as três notas.');if(!d.f)return err('Registre a fala do cliente.');const pr=p.marcos.find(m=>!m.v&&m.n===d.n),r={n:d.n,d:'2027-03-15',v:d.v,a:d.a,c:d.c,f:d.f,obs:d.obs||''};if(pr)Object.assign(pr,r);else{const i=p.marcos.findIndex(m=>!m.v);i<0?p.marcos.push(r):p.marcos.splice(i,0,r)}push(p);toast('Marco registrado · '+eixo(p,'valor').t)}
  if(mT==='feedback'){if(!d.tema)return err('Escolha um tema.');if(!d.nat)return err('Escolha a natureza.');if(!d.t)return err('Escreva o que o cliente disse.');S.feedbacks.unshift({p:d.p,d:'2027-03-15',tema:d.tema,nat:d.nat,st:d.nat==='elogio'?'resolvido':'em ação',t:d.t});toast('Feedback registrado · destino: '+NAT[d.nat][1])}
  if(mT==='oportunidade'){if(!d.fonte)return err('Escolha a fonte.');S.opps.push({p:d.p,tipo:'Recompra',serv:d.serv||'Delivery',fonte:d.fonte,etapa:d.etapa||0,valor:TICKET[d.serv||'Delivery'],mes:d.mes||'abr'});toast('Oportunidade registrada')}
  if(mT==='checagem'){if(d.dec==null)return err('Diga se o decisor esteve presente.');if(!d.rel)return err('Dê a nota de relacionamento.');p.checagem={d:'2027-03-15',rel:d.rel,decisor:d.dec};push(p);toast('Checagem registrada · '+eixo(p,'relacao').t)}
  if(mT==='overdelivery'){if(!d.t)return err('Descreva o que foi entregue.');S.impacto.unshift({d:'2027-03-15',t:`Overdelivery em ${p.conta}: ${d.t}`,k:'o'});toast('Overdelivery registrado no Impacto')}
  save();mC();render()};
document.getElementById('mCancel').onclick=mC;document.getElementById('mClose').onclick=mC;
document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')mC()});
addEventListener('keydown',e=>{if(e.key==='Escape')mC()});
document.getElementById('regBtn').onclick=()=>mO('marco');
document.getElementById('resetBtn').onclick=()=>{S=SEED();save();render();toast('Exemplo restaurado')};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}

const main=document.getElementById('main');
main.addEventListener('click',e=>{const b=e.target.closest('[data-reg],[data-open],[data-sub],[data-ctab],[data-ev],[data-copy],[data-ftipo],[data-jtipo],[data-jsel],[data-reixo],[data-cx],[data-ce],[data-adota],[data-persona],[data-sug],[data-orig],[data-chk],[data-qual],[data-od],[data-revp],[data-alvo]');if(!b)return;
  const keep=()=>{const y=scrollY;save();render();scrollTo(0,y)};
  if(b.dataset.revp){selP=b.dataset.revp;ctab='opps';location.hash='cliente';render();return}
  if(b.dataset.chk){const[id,k,v]=b.dataset.chk.split(':'),x=S.sq.find(z=>z.id===id);x.chk=x.chk||{};x.chk[k]=k==='dec'?!x.chk.dec:(x.chk[k]===v?undefined:v);keep();return}
  if(b.dataset.qual){const[id,a]=b.dataset.qual.split(':'),x=S.sq.find(z=>z.id===id);if(a==='r'){x.st='revisar';x.chk={};keep();return}if(a==='h'){x.st='hipotese';keep();toast('Mantida como hipótese no mapa');return}const sel=document.querySelector(`[data-serv="${id}"]`),sv=sel?sel.value:'Discovery';x.st='qualificada';x.serv=sv;S.opps.push({p:x.p,tipo:'Expansão',serv:sv,fonte:'Task do squad',etapa:1,valor:TICKET[sv],mes:'mai',prob:x.prob});keep();toast(cor(P(x.p))==='g'?'Qualificada · entrou no forecast da base':'Qualificada · fora do forecast até a conta voltar ao verde');return}
  if(b.dataset.alvo){const[id,t]=b.dataset.alvo.split(':'),x=S.sq.find(z=>z.id===id);x.alvo=x.alvo===t?null:t;keep();return}
  if(b.dataset.od){const[id,a]=b.dataset.od.split(':'),x=S.sq.find(z=>z.id===id);if(a==='r'){x.st='redirecionada';keep();toast('Volta ao squad: concentrar o esforço em '+x.alvo);return}x.st=a==='a'?'aprovada':'descartada';if(a==='a')S.impacto.unshift({d:'2027-03-15',t:`Overdelivery aprovado em ${P(x.p).conta}: ${x.ideia} Resultado esperado: ${x.res||''}`,k:'o'});keep();toast(a==='a'?'Aprovada · volta ao squad para executar':'Ideia arquivada');return}
  if(b.dataset.adota){S.jbOver=S.jbOver||{};S.jbOver[jtipo]=b.dataset.adota;save();render();toast('Premissa atualizada');return}
  if(b.dataset.persona){const p=P(selP);p.persona=p.persona||{obs:''};p.persona.perfil=p.persona.perfil===b.dataset.persona?'':b.dataset.persona;save();const y=scrollY;render();scrollTo(0,y);toast('Perfil salvo · as notas não mudam');return}
  if(b.dataset.orig){window.rOrig=b.dataset.orig;const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.sug){const[id,a]=b.dataset.sug.split(':'),x=S.sugs.find(z=>z.id===id),p=P(x.p);if(a==='d'){x.st='descartada';toast('Sugestão descartada')}else{x.st='confirmada';if(x.tipo==='feedback')S.feedbacks.unshift({p:x.p,d:x.d,tema:x.tema,nat:'cliente',st:'em ação',t:x.t,src:'taq',q:x.q});if(x.tipo==='oportunidade')S.opps.push({p:x.p,tipo:'Recompra',serv:x.serv,fonte:'taqCITi',etapa:0,valor:TICKET[x.serv],mes:'abr'});if(x.tipo==='decisor'){p.checagem.decisor=false;push(p)}toast('Confirmado e registrado')}save();const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.ce){cartEixo=cartEixo===b.dataset.ce?null:b.dataset.ce;const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.cx){cartOpen=cartOpen===b.dataset.cx?null:b.dataset.cx;const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.jtipo){jtipo=b.dataset.jtipo;jsel=0;render();return}
  if(b.dataset.jsel!=null){jsel=+b.dataset.jsel;render();return}
  if(b.dataset.reixo){rEixo=b.dataset.reixo;render();return}
  if(b.dataset.ftipo!=null){ftipo=b.dataset.ftipo||null;render();return}
  if(b.dataset.reg!=null){mO(b.dataset.reg,b.dataset.p||undefined);return}
  if(b.dataset.open){openP(b.dataset.open);return}
  if(b.dataset.sub){const[k,v]=b.dataset.sub.split(':');sub[k]=v;render();return}
  if(b.dataset.ctab){ctab=b.dataset.ctab;render();return}
  if(b.dataset.ev){openEv=openEv===b.dataset.ev?null:b.dataset.ev;render();return}
  if(b.dataset.copy){const t={sol:'Leitura da voz do cliente\n- Validação e uso: valorizado por 4 de 7 clientes, nota 2,8; causa de atraso em 4 de 8 projetos\n- Em teste: validação por sprint com prazo de 5 dias úteis (2,6 → 3,3)',fc:'Forecast da base\n'+S.opps.map(o=>`- ${P(o.p).conta}: ${o.tipo} ${o.serv}, ${ETAPAS[o.etapa][0]}, ${brl(pond(o))}`).join('\n'),imp:'Impacto de CS\n- 2 mudanças na operação\n- 14% do faturamento vindo da base (meta 10%)\n- 1 cliente recuperado\n- 1 indicação em contrato'}[b.dataset.copy];try{navigator.clipboard.writeText(t).then(()=>toast('Resumo copiado'),()=>toast('Não foi possível copiar'))}catch(_){toast('Não foi possível copiar')}}});
main.addEventListener('change',e=>{if(e.target.id==='selp'){selP=e.target.value;render()}if(e.target.id==='pobs'){const p=P(e.target.dataset.pid);p.persona=p.persona||{perfil:''};p.persona.obs=e.target.value;save();toast('Observação salva')}});
main.addEventListener('keydown',e=>{const r=e.target.closest('tr[data-open]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openP(r.dataset.open)}});
document.getElementById('colBtn').onclick=()=>{const a=document.getElementById('app'),m=a.classList.toggle('mini'),b=document.getElementById('colBtn');b.textContent=m?'›':'‹';b.setAttribute('aria-label',m?'Expandir barra lateral':'Recolher barra lateral');b.title=b.getAttribute('aria-label')};
const tipEl=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.style.opacity=0;return}tipEl.innerHTML=t.getAttribute('data-tip');tipEl.style.opacity=1;tipEl.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tipEl.style.top=Math.max(e.clientY-12-tipEl.offsetHeight,8)+'px'});
go();

</script>
</body>
