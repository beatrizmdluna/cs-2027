<style>
:root{color-scheme:dark;--bg:#08080A;--pn:#101014;--pn2:#16161C;--line:#1F1F27;--line2:#2A2A34;--grid:#1A1A21;--ink:#F1F0F5;--ink2:#A8A6B5;--mut:#6C6A7A;--green:#39F28A;--cyan:#3DE8FF;--violet:#A78BFA;--amber:#FFC24B;--red:#FF4D6D;--pink:#FF5C9A;--sans:"Sora",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}

.k-g{color:var(--green);border-color:rgba(57,242,138,.35);background:rgba(57,242,138,.06)}.k-y{color:var(--amber);border-color:rgba(255,194,75,.35);background:rgba(255,194,75,.06)}.k-r{color:var(--red);border-color:rgba(255,77,109,.4);background:rgba(255,77,109,.07)}.k-n{color:var(--mut);border-color:var(--line2)}.k-v{color:var(--violet);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.06)}.k-c{color:var(--cyan);border-color:rgba(61,232,255,.35);background:rgba(61,232,255,.06)}.k-p{color:var(--pink);border-color:rgba(255,92,154,.4);background:rgba(255,92,154,.06)}

.btn{border:1px solid var(--line2);background:var(--pn);border-radius:999px;padding:7px 15px;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.btn:hover{border-color:var(--ink2)}

.ax{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:end;height:48px}.ax div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.ax i{width:100%;border-radius:4px 4px 2px 2px;display:block}.ax span{font-family:var(--mono);font-size:9px;color:var(--mut)}

.feed{display:flex;flex-direction:column;gap:10px}
.nt{border:1px solid var(--line2);border-radius:13px;padding:12px 14px;background:var(--pn2)}

.nt .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.nt .top b{font-weight:500;font-size:13.5px}

.fr{display:grid;grid-template-columns:220px minmax(0,1fr) 170px;gap:14px;align-items:start;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--pn2)}
.fr.req{border-color:rgba(57,242,138,.35)}
.fr .lb b{display:block;font-weight:500;font-size:13.5px}.fr .lb span{font-size:11.5px;color:var(--mut)}
.fr .val{font-size:13px}.fr .why2{font-size:12px;color:var(--ink2)}
.opt{border:1px solid var(--line2);background:var(--bg);border-radius:9px;padding:5px 11px;font-size:12.5px}.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#03220F}
.ai{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(255,194,75,.4);border-radius:999px;padding:1px 8px}
.q{font-size:12px;color:var(--ink2);border-left:2px solid var(--amber);padding-left:9px;margin-top:6px;font-style:italic}
.track{display:flex;margin:18px 0 6px}.track .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:11.5px;color:var(--mut);text-align:center}

.tree{display:grid;grid-template-columns:1fr 1.3fr 1.6fr;gap:14px;align-items:stretch}

.exp{border:1px solid var(--line2);border-radius:16px;padding:16px}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px}.kv .cap{display:block;margin-bottom:4px}
.pauta{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pi{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start}
.pi .num{font-family:var(--mono);color:var(--c);font-size:13px}
.pi b{font-weight:500}.pi p{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#03220F;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}

 <section class="pn mt"><div class="row between"><h2>Mapa de oportunidades</h2><span class="ink2" style="font-size:13px">${p.opp.h} hipóteses · ${p.opp.q} qualificadas · ${p.od} overdelivery aprovado</span></div><div class="mt">${opps.length?opps.map(o=>`<div class="hb" style="grid-template-columns:minmax(0,1.4fr) 160px 140px 90px"><span>${o.tipo} · ${o.serv} <span class="mut">· origem: ${o.fonte}</span></span><span class="bar"><i style="width:${(o.etapa+1)/4*100}%;background:linear-gradient(90deg,#A78BFA,#3DE8FF)"></i></span><span class="cap">${ETAPA[o.etapa][0]}</span><span class="mono" style="text-align:right">${brl(o.valor)}</span></div>`).join(''):'<p class="sub">Nenhuma oportunidade qualificada ainda. As hipóteses aparecem quando o cliente confirma a dor.</p>'}</div></section>`;

function keep(){const y=scrollY;nav();main.innerHTML=V[route]();scrollTo(0,y)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)}
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.getAttribute('data-tip');tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY-40)+'px'});
